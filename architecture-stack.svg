<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" width="100%" height="320" fill="none">
  <defs>
    <linearGradient id="glow-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#06090e" />
    </linearGradient>
  </defs>

  <style>
    @keyframes float-l4 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-7px); } }
    @keyframes float-l3 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
    @keyframes float-l2 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-3px); } }
    @keyframes float-l1 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-1.5px); } }
    @keyframes bus-pulse {
      0% { stroke-dashoffset: 40; opacity: 0.2; }
      50% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }
    @keyframes dot-blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    .layer-4 { animation: float-l4 4.5s ease-in-out infinite; }
    .layer-3 { animation: float-l3 4.5s ease-in-out infinite 0.2s; }
    .layer-2 { animation: float-l2 4.5s ease-in-out infinite 0.4s; }
    .layer-1 { animation: float-l1 4.5s ease-in-out infinite 0.6s; }

    .bus-line {
      stroke: #38bdf8;
      stroke-dasharray: 4 6;
      animation: bus-pulse 3s linear infinite;
    }
    .pulse-led { animation: dot-blink 2s ease-in-out infinite; }

    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .slab-top { fill: #0d1527; stroke: #38bdf8; stroke-width: 0.9; }
    .slab-side-r { fill: #080d1a; stroke: #1e293b; stroke-width: 0.9; }
    .slab-side-l { fill: #0a1120; stroke: #1e293b; stroke-width: 0.9; }
    .slab-base { fill: #070a12; stroke: #1e293b; stroke-width: 1; }
    .grid-line { stroke: #17253b; stroke-width: 0.8; stroke-dasharray: 2 4; }
    
    .hl-tag { font-size: 11px; fill: #64748b; font-weight: 500; }
    .hl-title { font-size: 12.5px; fill: #f1f5f9; font-weight: 600; }
    .hl-desc { font-size: 11px; fill: #94a3b8; }
    .hl-accent { fill: #38bdf8; font-weight: 600; }
    .hl-meta { font-size: 10px; fill: #475569; }
  </style>

  <!-- Frame Background -->
  <rect x="1" y="1" width="818" height="318" rx="8" fill="url(#card-bg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Top Navigation & Chassis Bar -->
  <line x1="1" y1="36" x2="819" y2="36" stroke="#1e293b" stroke-width="1" />
  <circle cx="20" cy="18" r="4" fill="#1e293b" />
  <circle cx="34" cy="18" r="4" fill="#1e293b" />
  <circle cx="48" cy="18" r="4" fill="#1e293b" />
  <text class="mono hl-tag" x="410" y="22" text-anchor="middle">sys-arch :: isometric full-stack topology</text>
  <circle class="pulse-led" cx="785" cy="18" r="3.5" fill="#34d399" />
  <text class="mono hl-meta" x="772" y="22" text-anchor="end">SYNCED</text>

  <!-- Left Side: Technical Legend & Specifications -->
  <g transform="translate(36, 68)">
    <text class="mono hl-meta" x="0" y="0">SYSTEM SPECIFICATION</text>
    
    <!-- L4 Label -->
    <g transform="translate(0, 26)">
      <text class="mono hl-tag" x="0" y="0">04</text>
      <line x1="22" y1="-4" x2="40" y2="-4" stroke="#38bdf8" stroke-width="1" />
      <text class="mono hl-title" x="48" y="0">Edge and Client Layer</text>
      <text class="mono hl-desc" x="48" y="16">Next.js · TypeScript · React · Tailwind CSS</text>
    </g>

    <!-- L3 Label -->
    <g transform="translate(0, 68)">
      <text class="mono hl-tag" x="0" y="0">03</text>
      <line x1="22" y1="-4" x2="40" y2="-4" stroke="#64748b" stroke-width="1" />
      <text class="mono hl-title" x="48" y="0">Application Runtime and APIs</text>
      <text class="mono hl-desc" x="48" y="16">Node.js · REST / tRPC · Auth · Serverless</text>
    </g>

    <!-- L2 Label -->
    <g transform="translate(0, 110)">
      <text class="mono hl-tag" x="0" y="0">02</text>
      <line x1="22" y1="-4" x2="40" y2="-4" stroke="#64748b" stroke-width="1" />
      <text class="mono hl-title" x="48" y="0">Data and Persistence</text>
      <text class="mono hl-desc" x="48" y="16">PostgreSQL · MySQL · Prisma · Redis Caching</text>
    </g>

    <!-- L1 Label -->
    <g transform="translate(0, 152)">
      <text class="mono hl-tag" x="0" y="0">01</text>
      <line x1="22" y1="-4" x2="40" y2="-4" stroke="#64748b" stroke-width="1" />
      <text class="mono hl-title" x="48" y="0">Systems and Low-Level Base</text>
      <text class="mono hl-desc" x="48" y="16">C / C++ · Linux Kernel · POSIX · Bash CLI</text>
    </g>

    <!-- Base Note -->
    <text class="mono hl-meta" x="0" y="210">INTERFACING: Non-blocking I/O · Direct Memory Architecture</text>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="430" y1="52" x2="430" y2="295" stroke="#17253b" stroke-width="1" stroke-dasharray="3 3" />

  <!-- Right Side: Isometric Hairline Stack Geometry (Origin at x=620, y=260) -->
  <g transform="translate(620, 248)">
    
    <!-- Base Plinth (Chassis Platform) -->
    <g>
      <!-- Top Face -->
      <polygon class="slab-base" points="0,-16 130,49 0,114 -130,49" />
      <!-- Left Side -->
      <polygon class="slab-side-l" points="-130,49 0,114 0,126 -130,61" />
      <!-- Right Side -->
      <polygon class="slab-side-r" points="0,114 130,49 130,61 0,126" />
      <!-- Subtle Ground Grid lines -->
      <line class="grid-line" x1="-80" y1="24" x2="50" y2="89" />
      <line class="grid-line" x1="80" y1="24" x2="-50" y2="89" />
    </g>

    <!-- Vertical Bus Guide (Dashed spine linking all layers) -->
    <line class="bus-line" x1="0" y1="60" x2="0" y2="-170" />

    <!-- LAYER 1: Low-Level (C / Linux) -->
    <g class="layer-1" transform="translate(0, -26)">
      <!-- Top Face -->
      <polygon class="slab-top" stroke="#334155" fill="#0d1424" points="0,-14 104,38 0,90 -104,38" />
      <!-- Left Side -->
      <polygon class="slab-side-l" points="-104,38 0,90 0,98 -104,46" />
      <!-- Right Side -->
      <polygon class="slab-side-r" points="0,90 104,38 104,46 0,98" />
      <!-- Layer Center Node -->
      <circle cx="0" cy="38" r="2.5" fill="#64748b" />
    </g>

    <!-- LAYER 2: Data Layer (PostgreSQL) -->
    <g class="layer-2" transform="translate(0, -68)">
      <!-- Top Face -->
      <polygon class="slab-top" stroke="#334155" fill="#0f192d" points="0,-14 104,38 0,90 -104,38" />
      <!-- Left Side -->
      <polygon class="slab-side-l" points="-104,38 0,90 0,98 -104,46" />
      <!-- Right Side -->
      <polygon class="slab-side-r" points="0,90 104,38 104,46 0,98" />
      <circle cx="0" cy="38" r="2.5" fill="#38bdf8" />
    </g>

    <!-- LAYER 3: Runtime / API (Node.js) -->
    <g class="layer-3" transform="translate(0, -110)">
      <!-- Top Face -->
      <polygon class="slab-top" stroke="#38bdf8" stroke-width="0.7" fill="#13203a" points="0,-14 104,38 0,90 -104,38" />
      <!-- Left Side -->
      <polygon class="slab-side-l" points="-104,38 0,90 0,98 -104,46" />
      <!-- Right Side -->
      <polygon class="slab-side-r" points="0,90 104,38 104,46 0,98" />
      <circle cx="0" cy="38" r="2.5" fill="#38bdf8" />
    </g>

    <!-- LAYER 4: Edge / Client (Next.js & Frontend) -->
    <g class="layer-4" transform="translate(0, -152)">
      <!-- Top Face with Glowing Edge -->
      <polygon class="slab-top" stroke="#38bdf8" stroke-width="1.2" fill="#172746" points="0,-14 104,38 0,90 -104,38" />
      <!-- Left Side -->
      <polygon class="slab-side-l" stroke="#38bdf8" stroke-width="0.8" points="-104,38 0,90 0,98 -104,46" />
      <!-- Right Side -->
      <polygon class="slab-side-r" stroke="#38bdf8" stroke-width="0.8" points="0,90 104,38 104,46 0,98" />
      
      <!-- Inner Inset Plate (Hairline Crease Signature) -->
      <polygon points="0,-4 80,36 0,76 -80,36" fill="none" stroke="#38bdf8" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.6" />
      <circle class="pulse-led" cx="0" cy="36" r="3" fill="#38bdf8" />
    </g>

  </g>
</svg>
