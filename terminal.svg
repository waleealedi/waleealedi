<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="100%" height="270" fill="none">
  <defs>
    <linearGradient id="laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#06090e" />
    </linearGradient>
  </defs>

  <style>
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes sweep { 0% { transform: translateX(-820px); } 100% { transform: translateX(820px); } }
    
    .cursor { animation: blink 1s infinite; fill: #38bdf8; }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }
    .laser-line { animation: sweep 4s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .cmd { font-size: 13px; fill: #f8fafc; font-weight: 500; }
    .path { font-size: 13px; fill: #38bdf8; font-weight: 600; }
    .dim { font-size: 13px; fill: #64748b; }
    .label { font-size: 12.5px; fill: #94a3b8; font-weight: 600; }
    .val { font-size: 12.5px; fill: #e2e8f0; font-weight: 400; }
    .accent { font-size: 12.5px; fill: #38bdf8; font-weight: 500; }
    .success { font-size: 12px; fill: #34d399; font-weight: 500; }
  </style>

  <rect x="1" y="1" width="818" height="268" rx="8" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />

  <g clip-path="url(#border-clip)">
    <clipPath id="border-clip">
      <rect x="1" y="1" width="818" height="3" rx="1" />
    </clipPath>
    <rect class="laser-line" x="0" y="1" width="400" height="1.5" fill="url(#laser)" />
  </g>

  <line x1="1" y1="38" x2="819" y2="38" stroke="#1e293b" stroke-width="1" />
  <circle cx="22" cy="19" r="4.5" fill="#334155" />
  <circle cx="38" cy="19" r="4.5" fill="#334155" />
  <circle cx="54" cy="19" r="4.5" fill="#334155" />
  <text class="mono dim" x="410" y="23" text-anchor="middle" font-size="11">system-profile — zsh — 80x24</text>

  <text class="mono path" x="24" y="70">waleed@systems</text>
  <text class="mono dim" x="145" y="70">:</text>
  <text class="mono path" x="155" y="70">~</text>
  <text class="mono dim" x="170" y="70">$</text>
  <text class="mono cmd" x="185" y="70">sysinfo --target=architecture</text>

  <g transform="translate(24, 105)">
    <text class="mono label" x="0" y="0">ROLE</text>
    <text class="mono dim" x="110" y="0">→</text>
    <text class="mono val" x="130" y="0">Computer Engineer &amp; Full-Stack Developer</text>

    <text class="mono label" x="0" y="26">STACK</text>
    <text class="mono dim" x="110" y="26">→</text>
    <text class="mono accent" x="130" y="26">TypeScript <tspan fill="#64748b">·</tspan> Next.js <tspan fill="#64748b">·</tspan> Node.js <tspan fill="#64748b">·</tspan> C/C++ <tspan fill="#64748b">·</tspan> SQL</text>

    <text class="mono label" x="0" y="52">FOCUS</text>
    <text class="mono dim" x="110" y="52">→</text>
    <text class="mono val" x="130" y="52">Web Applications, Database Design, Low-Level Fundamentals</text>

    <text class="mono label" x="0" y="78">ENVIRONMENT</text>
    <text class="mono dim" x="110" y="78">→</text>
    <text class="mono val" x="130" y="78">Linux <tspan fill="#64748b">·</tspan> Bash <tspan fill="#64748b">·</tspan> Git <tspan fill="#64748b">·</tspan> PostgreSQL <tspan fill="#64748b">·</tspan> Vercel</text>

    <text class="mono label" x="0" y="104">STATUS</text>
    <text class="mono dim" x="110" y="104">→</text>
    <circle class="pulse-dot" cx="135" cy="100" r="3.5" fill="#34d399" />
    <text class="mono success" x="146" y="104">Active <tspan fill="#64748b">|</tspan> Building practical tools &amp; systems</text>
    <rect class="cursor" x="424" y="93" width="7" height="13" />
  </g>
</svg>

</svg>
